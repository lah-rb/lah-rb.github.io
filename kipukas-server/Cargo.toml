[package]
name = "kipukas-server"
version = "0.1.0"
edition = "2024"

# The engine is an ordinary Rust library. Two things are built from it:
#
#   - wasm/ wraps it as the WASM module the browser loads
#     (`deno task build:wasm`).
#   - src/bin/card-pages.rs runs it natively after every Jekyll build to
#     write the card pages and preview pictures (`_plugins/card_pages.rb`).
#
# The WASM module is a crate of its own, not a second crate-type of this one,
# because Cargo does not run link-time optimisation (see [profile.release]) on
# a library that is both `cdylib` and `rlib`. Measured here, that made the
# module 230 KB larger.
[workspace]
members = ["wasm"]

[dependencies]
wasm-bindgen = "0.2"
matchit = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.25"
base64 = "0.22"
# Already in the dependency tree via yrs (same version, same `js` feature, so
# no extra code in the wasm). Used directly for timer ids.
fastrand = { version = "2", features = ["js"] }
hmac-sha256 = "1.1"
# JXL decode (pure Rust). default-features=false drops rayon/threadpool — required for wasm32.
jxl-oxide = { version = "0.12.6", default-features = false }

# Build time only (src/preview.rs): writes the cards' preview pictures. Not
# compiled for the browser, so it adds nothing to the WASM module.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jpeg-encoder = "0.7.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# opt-level: "s" keeps the precached wasm lean (~612 KB gz). Measured opt-level=2
# was ~14% faster JXL decode but +189 KB gz — not worth bloating the precache for
# a path SIMD already made fast. Revisit if decode becomes a bottleneck again.
[profile.release]
opt-level = "s"
lto = true

# Development builds are optimised too: lightly for the engine, fully for its
# dependencies. card-pages runs as a development build after every Jekyll
# build, and the first time it makes the cards' preview pictures it decodes and
# scales every card's art. Measured here for 57 pictures: 146 s unoptimised,
# 8 s with these settings. Tests are built the same way.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
