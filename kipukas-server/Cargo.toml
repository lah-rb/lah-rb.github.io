[package]
name = "kipukas-server"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib for wasm-pack; rlib so the native build-time probe binary can link the
# shared decode logic (keeps SW prefix and worker decode in lockstep).
crate-type = ["cdylib", "rlib"]

# Native build tool: emits the per-card DC-prefix manifest consumed by
# scripts/build-card-catalog.ts. Excluded from the wasm build (see cfg in the
# source); only built when explicitly requested via `cargo run --bin jxl_probe`.
[[bin]]
name = "jxl_probe"
path = "src/bin/jxl_probe.rs"

[dependencies]
wasm-bindgen = "0.2"
matchit = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.25"
base64 = "0.22"
hmac-sha256 = "1.1"
# JXL decode (pure Rust). default-features=false drops rayon/threadpool — required for wasm32.
jxl-oxide = { version = "0.12.6", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true