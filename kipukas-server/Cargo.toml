[package]
name = "kipukas-server"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
matchit = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.25"
base64 = "0.22"
hmac-sha256 = "1.1"
# JXL decode (pure Rust). default-features=false drops rayon/threadpool — required for wasm32.
jxl-oxide = { version = "0.12.6", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# opt-level: "s" keeps the precached wasm lean (~612 KB gz). Measured opt-level=2
# was ~14% faster JXL decode but +189 KB gz — not worth bloating the precache for
# a path SIMD already made fast. Revisit if decode becomes a bottleneck again.
[profile.release]
opt-level = "s"
lto = true