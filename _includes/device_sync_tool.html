<!-- Sync Devices: pairs two of a player's devices to merge their player data.
     Opened from the hamburger menu (the open-device-sync event).

     What the dialog holds is an engine-owned view (Pattern 13,
     assets/js/kipukas-view.js) of /api/player/sync: the engine draws where
     the pairing stands, its forms post back to the engine, and it is drawn
     again as the relay and the other device answer
     (kipukas-server/src/routes/device_sync.rs, src/game/device_sync.rs).
     This file only opens and closes it. Closing ends the pairing, and the
     engine is told so. -->
<div x-data="{ showSync: false }"
     class="relative"
     x-init="$watch('showSync', value => { if (!value) kipukasViews.post('/api/player/sync', 'action=close'); })"
     @open-device-sync.window="showSync = true">

    <!-- Modal -->
    <div x-show="showSync" x-cloak
        role="dialog" aria-modal="true" aria-label="Sync devices"
        @keydown.escape.window="showSync = false"
        class="fixed inset-0 flex items-center justify-center z-50"
        x-transition.duration.350ms>

        <div class="absolute inset-0 bg-slate-300 opacity-75" @click="showSync = false"></div>

        <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto relative">
            <div id="device-sync" data-engine-view="/api/player/sync"></div>

            <!-- Close button -->
            <button @click="showSync = false"
                class="w-full bg-slate-400 hover:bg-slate-500 text-amber-50 font-bold py-2 px-4 rounded-b text-sm">
                Close
            </button>
        </div>
    </div>
</div>
