<!-- Player Data: a backup of the player's data as a file, and restoring from
     one. Opened from the hamburger menu (the open-player-data event).

     What the dialog holds is an engine-owned view (Pattern 13,
     assets/js/kipukas-view.js) of /api/player/backup: the engine draws its
     screens, checks the passphrase, signs and encrypts the backup, and opens
     and verifies one that is restored (kipukas-server/src/routes/backup.rs,
     src/game/backup.rs, src/game/crypto.rs). A backup reaches the player as
     a file through the engine's handover (DOWNLOAD in kipukas-api.js), and a
     chosen file is sent to the engine as its text. This file only opens and
     closes the dialog. Closing forgets what was typed, and the engine is
     told so. -->
<div x-data="{ showPlayerData: false }"
     class="relative"
     x-init="$watch('showPlayerData', value => { if (!value) kipukasViews.post('/api/player/backup', 'action=close'); })"
     @open-player-data.window="showPlayerData = true">

    <!-- Modal -->
    <div x-show="showPlayerData" x-cloak
        role="dialog" aria-modal="true" aria-label="Player data"
        @keydown.escape.window="showPlayerData = false"
        class="fixed inset-0 flex items-center justify-center z-50"
        x-transition.duration.350ms>

        <div class="absolute inset-0 bg-slate-300 opacity-75" @click="showPlayerData = false"></div>

        <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto relative">
            <div data-engine-view="/api/player/backup"></div>

            <!-- Close button -->
            <button @click="showPlayerData = false"
                class="w-full bg-slate-400 hover:bg-slate-500 text-amber-50 font-bold py-2 px-4 rounded-b text-sm">
                Close
            </button>
        </div>
    </div>
</div>
