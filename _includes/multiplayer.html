<!-- The room dialog (wifi icon): where a room is created, joined and left.
     What it holds is an engine-owned view (Pattern 13, assets/js/kipukas-view.js)
     of /api/room/status: the engine draws where the player stands, the forms
     and buttons in it post back to the engine, and it is drawn again when the
     relay or the opponent changes what it shows
     (kipukas-server/src/routes/room_status.rs, src/game/connection.rs).
     This file only opens and closes it. The engine is told of the closing, so
     that what it had to say (a room code that was wrong) is not said again. -->
<div x-data="{ showMultiplayer: false }" class="relative place-content-center"
     x-init="$watch('showMultiplayer', value => { if (!value) kipukasViews.post('/api/room/status', 'action=close'); })"
     @close-multiplayer.window="showMultiplayer = false">
  <!-- Multiplayer toggle button (wifi icon) -->
  <button aria-label="Toggle Multiplayer" @click="showMultiplayer = !showMultiplayer" class="toolbar-tile">
    <svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="toolbar-tile-icon fill-kip-drk-goldenrod hover:fill-kip-red">
      <path fill-rule="evenodd" d="M1.371 8.143c5.858-5.857 15.356-5.857 21.213 0a.75.75 0 0 1 0 1.061.75.75 0 0 1-1.06 0c-5.273-5.272-13.821-5.272-19.092 0a.75.75 0 0 1-1.06-1.06Zm3.182 3.182c4.1-4.1 10.749-4.1 14.85 0a.75.75 0 1 1-1.061 1.06 8.25 8.25 0 0 0-12.728 0 .75.75 0 0 1-1.06-1.06Zm3.182 3.182a6 6 0 0 1 8.486 0 .75.75 0 1 1-1.06 1.06 4.5 4.5 0 0 0-6.364 0 .75.75 0 0 1-1.06-1.06ZM12 18a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 0 1.5H12.75A.75.75 0 0 1 12 18Z" clip-rule="evenodd" />
    </svg>
  </button>

  <!-- Full-screen modal overlay -->
  <div x-show="showMultiplayer" x-cloak
    role="dialog" aria-modal="true" aria-label="Multiplayer room"
    x-trap="showMultiplayer" @keydown.escape.window="showMultiplayer = false"
    class="fixed inset-0 flex items-center justify-center z-50"
    x-transition.duration.350ms>

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-300 opacity-75" @click="showMultiplayer = false"></div>

    <!-- Modal content -->
    <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto relative">
      <div id="room-status" data-engine-view="/api/room/status"></div>

      <!-- Close button -->
      <div class="border-t border-slate-300 p-3">
        <button @click="showMultiplayer = false"
          class="w-full bg-slate-400 hover:bg-slate-500 text-amber-50 font-bold py-2 px-4 rounded text-sm">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
