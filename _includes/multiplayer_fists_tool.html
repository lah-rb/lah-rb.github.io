<!-- Multiplayer Fists Tool — appears when connected to a room (WASM: /api/room/fists) -->
<div x-data="{ showFistsMenu: false, roomConnected: false }"
     class="relative place-content-center"
     @room-connected.window="roomConnected = true"
     @room-disconnected.window="roomConnected = false"
     x-init="
       $watch('roomConnected', value => { if (!value) showFistsMenu = false });
       $watch('showFistsMenu', value => { if (!value && window.kipukasMultiplayer) kipukasMultiplayer.resetFists(); });
     ">
    <button @click="showFistsMenu = !showFistsMenu" aria-label="Toggle Fists Combat" x-show="roomConnected" x-cloak class="toolbar-tile">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="toolbar-tile-icon text-kip-drk-goldenrod hover:text-kip-red">
            <rect x="5" y="9.5" width="13" height="8" rx="2.5"/>
            <rect x="6" y="6" width="2.4" height="5" rx="1.2"/>
            <rect x="8.7" y="5.5" width="2.4" height="5.5" rx="1.2"/>
            <rect x="11.4" y="5.5" width="2.4" height="5.5" rx="1.2"/>
            <rect x="14.1" y="6" width="2.4" height="5" rx="1.2"/>
            <rect x="4" y="12.5" width="7" height="3.2" rx="1.6"/>
        </svg>
    </button>

    <!-- Full-screen modal overlay -->
    <div x-show="showFistsMenu" x-cloak
        class="fixed inset-0 flex items-center justify-center z-50"
        x-transition.duration.350ms
        x-effect="if (showFistsMenu) $nextTick(() => {
            if (typeof htmx !== 'undefined') {
                var fc = document.getElementById('fists-container');
                if (fc) htmx.ajax('GET', fc.getAttribute('hx-get') || '/api/room/fists', {target:'#fists-container', swap:'innerHTML'});
            }
        })">

        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-300 opacity-75" @click="showFistsMenu = false"></div>

        <!-- Modal content -->
        <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto relative">
            <div class="p-3 border-b border-slate-300">
                <p class="text-lg font-bold text-kip-drk-sienna">Fists Combat</p>
                <p class="text-xs text-slate-500">Multiplayer room combat</p>
            </div>

            <!-- Fists combat section -->
            <div id="fists-container"
              hx-get="/api/room/fists{% if include.card_slug %}?card={{ include.card_slug }}{% endif %}"
              hx-trigger="load"
              hx-swap="innerHTML">
            </div>
                        <!-- Close button -->
            <div class="border-t border-slate-300 p-3">
                <button @click="showFistsMenu = false"
                  class="w-full bg-slate-400 hover:bg-slate-500 text-amber-50 font-bold py-2 px-4 rounded text-sm">
                  Close
                </button>
            </div>
        </div>
    </div>
</div>
