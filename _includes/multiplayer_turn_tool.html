<!-- Multiplayer Turn Timer Tool — appears while in a room.
     Reads $store.room (registered by kipukas-api.js).
     The form is an engine-owned view (Pattern 13, assets/js/kipukas-view.js),
     the same one the solo timer's popover holds: in a room the engine adds
     the timer to the room's shared timers and has the change sent to the
     other player (kipukas-server/src/game/turns.rs). The dialog's opening and
     closing stays Alpine. The view is drawn each time the dialog opens. -->
<div x-data="{ showTurnMenu: false }"
     class="relative place-content-center"
     x-init="
       $watch('$store.room.inRoom', value => { if (!value) showTurnMenu = false });
     ">
    <button @click="showTurnMenu = !showTurnMenu" aria-label="Toggle Shared Turn Timer" x-show="$store.room.inRoom" x-cloak class="toolbar-tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            class="toolbar-tile-icon stroke-kip-drk-goldenrod hover:stroke-kip-red">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
    </button>

    <!-- Full-screen modal overlay -->
    <div x-show="showTurnMenu" x-cloak
        role="dialog" aria-modal="true" aria-label="Shared turn timer"
        x-trap="showTurnMenu" @keydown.escape.window="showTurnMenu = false"
        class="fixed inset-0 flex items-center justify-center z-50"
        x-transition.duration.350ms>

        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-300 opacity-75" @click="showTurnMenu = false"></div>

        <!-- Modal content -->
        <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto relative">
            <div class="p-3 border-b border-slate-300">
                <p class="text-lg font-bold text-kip-drk-sienna">Shared Turn Timer</p>
                <p class="text-xs text-slate-500">Synced with multiplayer room</p>
            </div>

            <!-- Turn timer section -->
            <div id="turn-container" data-engine-view="/api/game/turns/form"></div>

            <!-- Close button -->
            <div class="border-t border-slate-300 p-3">
                <button @click="showTurnMenu = false"
                  class="w-full bg-slate-400 hover:bg-slate-500 text-amber-50 font-bold py-2 px-4 rounded text-sm">
                  Close
                </button>
            </div>
        </div>
    </div>
</div>
