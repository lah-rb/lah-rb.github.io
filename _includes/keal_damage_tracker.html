{% capture cardSlug %}{{ page.permalink | remove: '/' }}{% endcapture %}

<!-- Keal damage tracker — an engine-owned view (assets/js/kipukas-view.js).

     The engine holds the damage state and renders the tracker from it:
     which slots are marked is in the markup itself (aria-pressed and the
     circle's classes), not in a copy kept by the page. A tap asks the engine
     for a change; the view is then redrawn from the engine and patched in
     place. Anything else that changes damage (a lost round of fists, New
     Game) redraws it the same way, via kipukasViews.refresh(). -->
<div id="keal-damage-{{ cardSlug }}"
     class="w-full grid grid-cols-1 place-self-center"
     data-engine-view="/api/game/damage?card={{ cardSlug }}">
</div>
