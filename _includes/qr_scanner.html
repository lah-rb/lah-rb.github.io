<!-- QR Scanner.
     The scanner is an engine-owned view (Pattern 13, assets/js/kipukas-view.js)
     of /api/qr/status: the engine holds whether it is open and draws it (the
     camera privacy notice, the camera's picture and controls, what went
     wrong), and every tap on it is a post to the engine
     (kipukas-server/src/routes/qr.rs).
     The camera is the page's: qr-camera.js runs it while the scanner's video
     is drawn. The engine's worker reads the codes (kipukas-worker.js). -->

<!-- The scanner. Empty while it is closed. -->
<div id="qr-container" data-engine-view="/api/qr/status"></div>

<!-- Button to open or close the scanner. The camera script is loaded on the
     first press. -->
<button aria-label="Toggle QR Scanner"
        class="{{ include.buttonClass }}"
        onclick="window.kipukasLoadQR().then(function() { kipukasViews.send('/api/qr/status', 'action=toggle'); })">
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
    viewBox="0 0 128 128"
    :class="landscapeArt ? '' : 'lg:fill-kip-goldenrod'"
    class="{{ include.base_fill }}{{ include.svgClass }}">
