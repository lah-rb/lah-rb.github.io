<!-- Turn timer, outside a room. Two engine-owned views (Pattern 13,
     assets/js/kipukas-view.js): the form that makes a timer, in a popover, and
     the list of timers, top left. The engine renders both and owns the timers;
     this file holds no copy of them and no script.
     The popover's opening and closing (showTurnTracker) stays Alpine — purely
     visual. Its view is drawn each time it opens.
     In a room the button and popover hide and multiplayer_turn_tool.html takes
     over; the list stays, and the engine fills it with the room's timers. -->
<div x-data="{ showTurnTracker: false }">
    <button @click="showTurnTracker = !showTurnTracker"
        x-show="!$store.room.inRoom" x-cloak
        x-ref="turnTracker" aria-label="Turn Timer" class="toolbar-tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            class="toolbar-tile-icon stroke-kip-drk-goldenrod hover:stroke-kip-red">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
    </button>

    <div x-show="showTurnTracker && !$store.room.inRoom" x-cloak
    role="dialog" aria-label="Turn timer" @keydown.escape.window="showTurnTracker = false"
    x-anchor.right-end.offset.10="$refs.turnTracker"
    x-transition.duration.350ms
    class="{{ include.menuClass }} grid grid-cols-1 h-fit w-56"
    id="turn-tracker-panel"
    data-engine-view="/api/game/turns/form">
    </div>
</div>

<!-- The list of timers: always in the page, top left. Empty when there are none. -->
<div id="turn-alarms" class="fixed top-0 left-0 m-6 grid grid-cols-1"
     data-engine-view="/api/game/turns?display=alarms">
</div>
