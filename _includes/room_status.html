<!-- Room status — a small pill, bottom-left, shown while this player is in a
     multiplayer room. Included from _layouts/default.html so every page has it,
     including pages with no multiplayer tools (hand view, about pages).

     Reads $store.room, which kipukas-api.js registers and kipukas-multiplayer.js
     keeps current:
       green dot               connected, opponent present
       "Waiting for opponent"  connected to the relay, opponent not there
       "Reconnecting…"         this player's own connection is down, retrying
       "Opponent needs to update"  the opponent is on an older copy of the site;
                               timers and combat will not sync until they update
       "Room expired"          the relay no longer has the room

     Every page change reconnects for a moment, so the amber states only
     appear if they last longer than 1.5 s.

     The rules book (kipukas_rules_book/index.html) is a standalone page and
     carries its own copy of this block: keep the two in step. -->
<div x-data="{
       tone: 'off',
       label: '',
       sync() {
         const room = this.$store.room;
         let tone = 'off';
         let label = '';
         if (room.link === 'expired') { tone = 'bad'; label = 'Room expired'; }
         else if (room.inRoom && room.link !== 'open') { tone = 'warn'; label = 'Reconnecting…'; }
         else if (room.inRoom && !room.peer) { tone = 'warn'; label = 'Waiting for opponent'; }
         else if (room.inRoom && room.outdated) { tone = 'warn'; label = 'Opponent needs to update'; }
         else if (room.inRoom) { tone = 'ok'; label = 'Connected'; }

         clearTimeout(this.$el._roomStatusTimer);
         if (tone === 'warn') {
           this.$el._roomStatusTimer = setTimeout(() => { this.tone = tone; this.label = label; }, 1500);
         } else {
           this.tone = tone;
           this.label = label;
         }
       }
     }"
     x-effect="sync()"
     x-show="tone !== 'off'" x-cloak
     id="room-status-pill"
     role="status" aria-live="polite"
     class="fixed bottom-0 left-0 z-40 m-3 flex items-center gap-2 rounded-full bg-amber-50/90 px-2.5 py-1.5 text-xs font-semibold text-kip-drk-sienna shadow-md select-none">
  <span class="h-2.5 w-2.5 rounded-full"
        :class="{ 'bg-emerald-500': tone === 'ok', 'bg-amber-500 animate-pulse': tone === 'warn', 'bg-kip-red': tone === 'bad' }"></span>
  <span x-text="label" :class="{ 'sr-only': tone === 'ok' }"></span>
  <button type="button" x-show="tone === 'bad'" aria-label="Dismiss"
          @click="$store.room.link = 'idle'"
          class="ml-1 cursor-pointer opacity-60 hover:opacity-100">&#x2715;</button>
</div>
