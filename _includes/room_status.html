<!-- Room status: a small pill, bottom left, shown while this player is in a
     multiplayer room. Included from _layouts/default.html so every page has
     it, including pages with no multiplayer tools (hand view, about pages).

     An engine-owned view (Pattern 13, assets/js/kipukas-view.js) of
     /api/room/pill: the engine knows where the connection stands and draws
     the pill, or nothing outside a room
     (kipukas-server/src/routes/room_status.rs lists what it can show).

     The rules book (kipukas_rules_book/index.html) is a standalone page and
     has the same element. -->
<div data-engine-view="/api/room/pill" role="status" aria-live="polite"></div>
