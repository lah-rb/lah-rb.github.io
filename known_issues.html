      <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the default behavior (which would be to show the install prompt automatically)
    e.preventDefault();
    // Stash the event so it can be triggered later.
    deferredPrompt = e;
    });

    // ============================================
    // AUTO-HIDE: detect if the PWA is already installed
    // ============================================

    // Layer 1: If running in standalone / fullscreen mode, the PWA is installed.
    if (window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        navigator.standalone === true) {
      // We need to wait for Alpine to initialise the data stack before setting.
      document.addEventListener('alpine:init', () => {
        Alpine.store('__pwaInstalled', true);
      });
      // Also set via DOM once body x-data is ready (belt-and-suspenders)
      document.addEventListener('DOMContentLoaded', () => {
        const body = document.body;
        if (body && body._x_dataStack) {
          body._x_dataStack[0].hideInstallButton = true;
        }
      });
      // Installed PWA launch: warm/resume the offline cache (idempotent — skips
      // already-cached entries, so re-running each launch finishes an interrupted warm).
      if (navigator.serviceWorker) {
        navigator.serviceWorker.ready.then((reg) => {
          if (reg.active) reg.active.postMessage({ type: 'WARM_OFFLINE_CACHE' });
        });
      }
    }

    // Layer 2: Listen for the appinstalled event (fires when user completes install).
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App installed — hiding install button');
      // Set Alpine persisted state so the button stays hidden on future visits
      const body = document.body;
      if (body && body._x_dataStack) {
        body._x_dataStack[0].hideInstallButton = true;
      }
      deferredPrompt = null;

      // Notify the Service Worker so it can track install state independently,
      // and ask it to warm the full offline cache (card art + QR decoder).
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'PWA_INSTALLED' });
        navigator.serviceWorker.controller.postMessage({ type: 'WARM_OFFLINE_CACHE' });
      }
    });

    // Layer 3: Ask the Service Worker if it already knows the PWA was installed.
    // This covers cases where localStorage was cleared but the SW persists.
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then((registration) => {
        if (!registration.active) return;
        const ch = new MessageChannel();
        ch.port1.onmessage = (msg) => {
          if (msg.data && msg.data.installed === true) {
            const body = document.body;
            if (body && body._x_dataStack) {
              body._x_dataStack[0].hideInstallButton = true;
            }
          }
        };
        registration.active.postMessage({ type: 'PWA_INSTALL_CHECK' }, [ch.port2]);
      });
    }

    // Check if the deferred prompt isn't null, then show the prompt
    function handlePWAInstall() {
    if (deferredPrompt) {
        deferredPrompt.prompt();

        // Wait for the user to make a choice
        deferredPrompt.userChoice.then((choiceResult) => {
            console.log('[PWA] Install choice:', choiceResult.outcome);
            if (choiceResult.outcome === 'accepted') {
                // The appinstalled event will fire and handle hiding,
                // but set it here too for immediate feedback.
                const body = document.body;
                if (body && body._x_dataStack) {
                    body._x_dataStack[0].hideInstallButton = true;
                }
            }
            // We've used the prompt, and can't use it again, so set this to null
            deferredPrompt = null;
        });
    } else {
        alert(`You are unable to install the Kipukas Binder web app at this time.
        
If you already installed our app, then great! This is expected because you don't need to install it again. Click ok to hide the install button.
        
If you have not already installed our pwa, check if your browser (and launcher if on android) support(s) pwa installs. While many browsers work well, Chromium based browsers (i.e. Bromite, Vanadium, Brave, and of course Google Chrome) deliver the most consistent experience across devices followed closely by firefox. We will go ahead and hide the install button.`);

        // Hide the install button
        const body = document.body;
        if (body && body._x_dataStack) {
            body._x_dataStack[0].hideInstallButton = true;
        }
    }
}
    
</script>

      <h1 class="z-20 text-2xl relative text-kip-drk-goldenrod top-0 md:text-4xl py-5 place-self-center">
        Browser Support & Troubleshooting
      </h1>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Kipukas runs entirely in your browser — there is no backend, and every card image is decoded
        on your own device. That keeps the binder private and free, but it also means a handful of
        quirks come down to your browser's settings rather than a bug on our end. Here are the ones
        we know about and how to fix each in a few seconds.
      </p>
      <div class="bg-kip-red w-3/4 h-0.5 place-self-center"></div>

      <!-- ─── Hardened browser speed (Vanadium / GrapheneOS) ─── -->
      <h2 class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">The binder is very slow on a hardened browser</h2>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        If you're on <b>GrapheneOS Vanadium</b> (or a similarly locked-down browser) the binder can
        feel sluggish — cards take noticeably longer to appear. This is by design: Vanadium turns off
        the JavaScript <b>JIT</b> as a security hardening measure, which forces our WebAssembly image
        decoder to run interpreted instead of compiled. The work still happens, just much more slowly.
      </p>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Fix:</b> allow the JIT for this site. In Vanadium, open the site settings for
        <span class="italic">kipukas.cards</span> (tap the lock/page icon in the address bar →
        site settings) and enable <b>JavaScript JIT</b>. Reload, and the binder runs at full speed.
        Testers have confirmed this resolves it completely.
      </p>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Other privacy-focused browsers — <span class="italic">Cromite, Trichrome, IronFox, and Floorp</span> —
        keep the JIT on, so they're already fast with no changes needed.
      </p>

      <!-- ─── Gray tiles / WASM disabled ─── -->
      <h2 class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Cards show up as gray tiles</h2>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Each card's art is decoded locally with WebAssembly. If the gray placeholder tiles never fill
        in with art, it almost always means your browser (or a privacy extension) is <b>blocking
        WebAssembly or JavaScript</b> for the site. A browser with WASM restricted can't paint the
        images at all. (An older browser without WASM SIMD is fine: it is given a build that does
        not need it.)
      </p>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Fix:</b> allow JavaScript and WebAssembly for <span class="italic">kipukas.cards</span>
        (and whitelist the site in any script-blocking extension), then reload. The tiles will fill in.
      </p>

      <!-- ─── Multiplayer on VPNs ─── -->
      <h2 class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Multiplayer won't connect on my VPN</h2>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Multiplayer rooms sync over a lightweight relay connection. Some VPNs block the underlying
        WebSocket traffic that relay needs, so the room never connects (a tester first hit this
        on <span class="italic">Riseup VPN</span>). Everything else — browsing the binder, single-device
        tools, and offline play — is unaffected, since none of it touches the network.
      </p>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Fix:</b> turn the VPN off while playing multiplayer, or use split-tunneling / an allowlist
        to exempt <span class="italic">kipukas.cards</span> from the tunnel. Re-join the room afterward.
      </p>

      <!-- ─── Stale content / force update ─── -->
      <h2 class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">I'm still seeing an old version</h2>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The binder is offline-first: a background service worker caches the app so it loads instantly
        and works without a connection. After we ship an update, the new version downloads in the
        background and applies the next time you reopen the app — so it normally self-heals on its own.
      </p>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Fix (if you want it now):</b> in the browser, do a hard refresh
        (<span class="italic">Ctrl/Cmd + Shift + R</span>, or pull-to-refresh on mobile). For the
        installed app, fully close and reopen it. If something still looks wrong after that, clearing
        the site's data and reloading will rebuild the cache from scratch. Clearing the site's data
        also clears your saved progress, so export an encrypted backup first
        (<span class="italic">Player Data</span> in the menu) and import it afterward.
      </p>

      <!-- ─── iPhone camera prompt ─── -->
      <h2 class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">My iPhone asks for the camera every time</h2>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Safari on an iPhone asks for permission to use the camera each time the QR scanner is opened on a
        new page, unless it has been told to always allow the camera for the site. Nothing is wrong, and
        the binder cannot change it for you.
      </p>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Fix:</b> set Camera to <b>Allow</b> in Safari's Website Settings for
        <span class="italic">kipukas.cards</span>. The steps are in
