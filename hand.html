<!-- The hand: one engine-owned view (Pattern 13, assets/js/kipukas-view.js).
     The cards are named in the address by their short codes, after the #
     (/hand/#KVphRrDC is two cards). {hash} passes them to the engine, which
     renders a pane for each card (kipukas-server/src/routes/hand.rs), or says
     the hand is empty. It is drawn again when the address changes. There is
     no script here. -->
<div class="w-screen h-screen overflow-hidden" data-engine-view="/api/hand?codes={hash}"></div>
