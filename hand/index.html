    <!-- Starts the game engine and does for it what only a page can.

    <!-- The QR scanner's camera script, loaded when its button is first pressed -->
    <script>
      window.kipukasLoadQR = function() {
        if (!window.kipukasQRLoading) {
          window.kipukasQRLoading = import('/assets/js/qr-camera.js').catch(function(err) {
            console.error('Failed to load QR camera:', err);
          });
        }
        return window.kipukasQRLoading;
      };
    </script>

    <!-- Room status: a small pill, bottom left, shown while this player is in a
     multiplayer room. Included from _layouts/default.html so every page has
     it, including pages with no multiplayer tools (hand view, about pages).

     An engine-owned view (Pattern 13, assets/js/kipukas-view.js) of
     /api/room/pill: the engine knows where the connection stands and draws
     the pill, or nothing outside a room
     (kipukas-server/src/routes/room_status.rs lists what it can show).

     The rules book (kipukas_rules_book/index.html) is a standalone page and
     has the same element. -->
<div data-engine-view="/api/room/pill" role="status" aria-live="polite"></div>

<!-- The hand: one engine-owned view (Pattern 13, assets/js/kipukas-view.js).
     The cards are named in the address by their short codes, after the #
     (/hand/#KVphRrDC is two cards). {hash} passes them to the engine, which
     renders a pane for each card (kipukas-server/src/routes/hand.rs), or says
     the hand is empty. It is drawn again when the address changes. There is
     no script here. -->
<div class="w-screen h-screen overflow-hidden" data-engine-view="/api/hand?codes={hash}"></div>
