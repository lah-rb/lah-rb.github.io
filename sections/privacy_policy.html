    <h1 class="text-3xl font-bold text-left my-4">Zero-Data Collection Privacy Policy</h1>
    <h3 class="text-xl"><span class="font-bold">Effective Date:</span> November, 2026</h3>
    <p>At our website, we are dedicated to preserving your privacy. We understand the importance of trust and transparency when it comes to handling your personal information. From here on Feature refers to our QR Scanner. <strong>You must explicitly accept the privacy policy to use the feature.</strong> Two parts of this website are not covered by what follows about the Feature: multiplayer with device sync, and Kippa. Each has a section of its own below.</p>
    {% assign para_class =  'text-2xl font-bold mt-6 mb-4 text-left z-20' %}
    <h2 class="{{ para_class }}">No Information Collection</h2>
    <p>When using our Feature, we do not gather any data from your device's camera or any other aspect of your device. The Feature operates without accessing or storing any personal information, allowing you to scan Kipukas QR codes safely and anonymously.</p>

    <h2 class="{{ para_class }}">Purpose of Information Use</h2>
    <p>Our Feature is solely meant to provide a quick and convenient QR code scanning experience within the confines of our website. We do not utilize the scanned QR code information for any secondary purposes, analytics, or marketing.</p>

    <h2 class="{{ para_class }}">Security and Privacy</h2>
    <p>Although we don't collect any data, we take the security of our Feature seriously. We implement industry-standard technical measures to protect against unauthorized access or disclosure, even though there's nothing to disclose.</p>

    <h2 class="{{ para_class }}">Third-Party Services</h2>
    <p>In order to deliver the Feature, we utilize third-party libraries like ZXing C++. Please note that these third parties may have their own privacy policies, which may apply when their services are in use. We encourage you to review their privacy statements for more information. We build on an open stack.</p>

    <h2 id="multiplayer" class="{{ para_class }}">Multiplayer and Device Sync</h2>
    <p>Playing in a room with another player, and moving a game from one of your devices to another, use a server. The security rules of the web do not let two browsers connect to one another directly, so the two devices exchange messages through a relay of ours. The relay passes each message on and keeps none of them. It asks for no account and no name, and collects no personal information. While a room exists the relay holds the room's code, the room's name, a random identifier for each of the two devices and when each was last connected. It deletes these when the room is left or, at the latest, twelve hours after the last device disconnects. A game moved between your own devices is encrypted on your devices with a key the relay never receives, so the relay cannot read it. The relay runs on Cloudflare, which has its own privacy policy. The website does not contact the relay until you create or join a room, or start a sync.</p>

    <h2 id="kippa" class="{{ para_class }}">Kippa</h2>
    <p>Kippa is the rules assistant in our game rules. Unlike the rest of this website, it runs on a server of ours: a question you put to Kippa is sent to that server, with the few exchanges before it, and the answer is sent back. These interactions may be logged anonymously, and we may inspect them, primarily to aid in developing the game's mechanics and the website's functionality. Kippa asks for no account and no name, so please put nothing in a question that identifies you. The rest of the website works without Kippa, and does not contact Kippa's server until you open its chat.</p>

    <h2 class="{{ para_class }}">Children's Privacy</h2>
    <p>Our website is not intended for children under 13 years of age. We do not knowingly collect or solicit personal information from children. If we become aware of any accidental collection, we will promptly delete the information.</p>

    <h2 class="{{ para_class }}">Changes to Privacy Policy</h2>
    <p>We may update this Privacy Policy occasionally. Any significant changes will be clearly posted on this page, along with an updated "effective date" at the top. Regularly reviewing our Privacy Policy helps you stay informed about our privacy practices.</p>

    <h2 class="{{ para_class }}">Contact</h2>
    <p>Should you have any questions or concerns about our Privacy Policy, please reach out to us at <a href="mailto:kipukas.games@gmail.com" class="text-kip-drk-sienna underline">kipukas.games@gmail.com</a>. Your trust is our top priority, and we're here to address any queries you may have.</p>
