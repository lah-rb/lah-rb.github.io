      <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the default behavior (which would be to show the install prompt automatically)
    e.preventDefault();
    // Stash the event so it can be triggered later.
    deferredPrompt = e;
    });

    // ============================================
    // AUTO-HIDE: detect if the PWA is already installed
    // ============================================

    // Layer 1: If running in standalone / fullscreen mode, the PWA is installed.
    if (window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        navigator.standalone === true) {
      // We need to wait for Alpine to initialise the data stack before setting.
      document.addEventListener('alpine:init', () => {
        Alpine.store('__pwaInstalled', true);
      });
      // Also set via DOM once body x-data is ready (belt-and-suspenders)
      document.addEventListener('DOMContentLoaded', () => {
        const body = document.body;
        if (body && body._x_dataStack) {
          body._x_dataStack[0].hideInstallButton = true;
        }
      });
      // Installed PWA launch: warm/resume the offline cache (idempotent — skips
      // already-cached entries, so re-running each launch finishes an interrupted warm).
      if (navigator.serviceWorker) {
        navigator.serviceWorker.ready.then((reg) => {
          if (reg.active) reg.active.postMessage({ type: 'WARM_OFFLINE_CACHE' });
        });
      }
    }

    // Layer 2: Listen for the appinstalled event (fires when user completes install).
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App installed — hiding install button');
      // Set Alpine persisted state so the button stays hidden on future visits
      const body = document.body;
      if (body && body._x_dataStack) {
        body._x_dataStack[0].hideInstallButton = true;
      }
      deferredPrompt = null;

      // Notify the Service Worker so it can track install state independently,
      // and ask it to warm the full offline cache (card art + QR decoder).
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'PWA_INSTALLED' });
        navigator.serviceWorker.controller.postMessage({ type: 'WARM_OFFLINE_CACHE' });
      }
    });

    // Layer 3: Ask the Service Worker if it already knows the PWA was installed.
    // This covers cases where localStorage was cleared but the SW persists.
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then((registration) => {
        if (!registration.active) return;
        const ch = new MessageChannel();
        ch.port1.onmessage = (msg) => {
          if (msg.data && msg.data.installed === true) {
            const body = document.body;
            if (body && body._x_dataStack) {
              body._x_dataStack[0].hideInstallButton = true;
            }
          }
        };
        registration.active.postMessage({ type: 'PWA_INSTALL_CHECK' }, [ch.port2]);
      });
    }

    // Check if the deferred prompt isn't null, then show the prompt
    function handlePWAInstall() {
    if (deferredPrompt) {
        deferredPrompt.prompt();

        // Wait for the user to make a choice
        deferredPrompt.userChoice.then((choiceResult) => {
            console.log('[PWA] Install choice:', choiceResult.outcome);
            if (choiceResult.outcome === 'accepted') {
                // The appinstalled event will fire and handle hiding,
                // but set it here too for immediate feedback.
                const body = document.body;
                if (body && body._x_dataStack) {
                    body._x_dataStack[0].hideInstallButton = true;
                }
            }
            // We've used the prompt, and can't use it again, so set this to null
            deferredPrompt = null;
        });
    } else {
        alert(`You are unable to install the Kipukas Binder web app at this time.
        
If you already installed our app, then great! This is expected because you don't need to install it again. Click ok to hide the install button.
        
If you have not already installed our pwa, check if your browser (and launcher if on android) support(s) pwa installs. While many browsers work well, Chromium based browsers (i.e. Bromite, Vanadium, Brave, and of course Google Chrome) deliver the most consistent experience across devices followed closely by firefox. We will go ahead and hide the install button.`);

        // Hide the install button
        const body = document.body;
        if (body && body._x_dataStack) {
            body._x_dataStack[0].hideInstallButton = true;
        }
    }
}
    
</script>

      class="z-10 grid grid-cols-1 bg-amber-50 outline outline-kip-drk-goldenrod text-kip-drk-goldenrod text-justify leading-loose px-2 md:px-10 w-5/6 h-fit min-h-screen scroll-smooth text-sm md:text-lg">

      <h1 class="z-20 text-2xl relative text-kip-drk-goldenrod top-0 md:text-4xl py-5 place-self-center">
        Using the Binder
      </h1>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        This page walks you through every tool available on
        <a href="https://www.kipukas.cards" class="underline">kipukas.cards</a>.
        If you just want to learn the game rules, head to the
        <a href="/game_rules/" class="underline">Rules</a> instead.
      </p>
      <div class="bg-kip-red w-3/4 h-0.5 place-self-center"></div>

      <!-- ─── Finding Cards ─── -->
      <h2 id="finding-cards" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Finding Cards</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <a href="/" class="underline">Binder Home</a> shows every card, and adds more to the page as you scroll.
        Tap a card to open its page. Two buttons in the toolbar narrow the binder down:
      </p>

      <ul class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-disc list-inside space-y-1">
        <li><b>Search</b> (magnifying glass) — opens a search bar. Type part of a card's name and the binder shows the cards that match as you type. It shows nothing until you have typed something. Press the button again to close the search and get the binder back as it was.</li>
        <li><b>Filter</b> (funnel) — opens a menu of boxes: card <b>Variations</b> (Character, Species, Trap, Item and the rest), <b>Soul Types</b>, <b>Motivations</b> and <b>Habitats</b>. Untick <b>Show All</b> first, then tick what you are looking for. A card is shown if it matches any box you ticked. The number beside Show All is how many cards the binder holds.</li>
      </ul>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        A search looks through the whole binder, whatever the filter says. Both start over when you leave the
        page: a fresh visit shows every card.
      </p>

      <!-- ─── Card Art ─── -->
      <h2 id="card-art" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Card Art</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        A card's page lays its play data over its art. The <b>eye</b> button in the toolbar hides the play data
        so you can see the art by itself. Press it again (it is then a crossed-out eye) to bring the play data
        back.
      </p>

      <!-- ─── QR Scanner ─── -->
      <h2 id="qr-scanner" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">QR Scanner</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Every Kipukas card has a unique QR code printed on its back. Scanning it takes you straight to that card's
        play data page. To make this as user-friendly as possible we include a <b>private QR scanner</b> that
        runs entirely on your device through our web app. The camera feed is never stored and never touches the
        internet — neither we nor any other interested party can see footage from the scanner.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>How to scan:</b> Click the <b>QR button</b> in the toolbar, accept the privacy notice the first time,
        then point your camera at a card's back. Keep the QR code inside the square the scanner shows: it reads
        only what you see there. When a valid Kipukas QR is detected you will be taken to that card's page
        automatically. If you change your mind about the privacy notice, you can take your acceptance back
        under <a href="#settings" class="underline">Settings</a>.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>The scanner's buttons:</b>
      </p>

      <ul class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-disc list-inside space-y-1">
        <li><b>Crossed-out eye</b> (top left) — closes the scanner.</li>
        <li><b>Circling arrows</b> (top center) — switches between the camera that faces you and the one that faces away. On a computer with several cameras it steps to the next one. A camera that faces you is shown mirrored; one that faces away is not.</li>
        <li><b>Lightning bolt</b> (top right) — turns the screen white to light the card, which helps a front-facing camera in a dim room.</li>
        <li><b>Chip</b> (bottom left) — turns on computer vision, an optional helper that finds the code in the picture before reading it. It helps with small, tilted, or far-away codes. It downloads a model the first time it is used and can be slow on older devices.</li>
      </ul>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The scanner opens the way you left it, with the same camera, light, and computer vision choice.
      </p>

      <h3 id="iphone-camera" class="z-20 text-lg md:text-xl pt-4 pb-1 place-self-center text-center">iPhone: Camera Permission</h3>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        On an iPhone, Safari asks for permission to use the camera every time you open the scanner on a new
        page. The binder cannot change that, but you can tell Safari to always allow the camera for this site:
      </p>

      <ol class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-decimal list-inside space-y-1">
        <li>Open <span class="italic">kipukas.cards</span> in Safari.</li>
        <li>Tap the <b>Page Menu</b> button
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="a rounded square with two lines under it"
            class="inline-block size-6 align-text-bottom fill-none stroke-current stroke-2"><rect x="5.5" y="2.5" width="13" height="11.5" rx="3.5" /><path stroke-linecap="round" d="M6.5 18h11M6.5 21.5h11" /></svg>
          on the right side of the address bar.</li>
        <li>Tap the <b>More</b> button
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="three dots"
            class="inline-block size-6 align-text-bottom fill-current"><circle cx="5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="19" cy="12" r="1.9" /></svg>
          on the right.</li>
        <li>Scroll to the bottom and tap <b>Website Settings</b> for <span class="italic">kipukas.cards</span>.</li>
        <li>Tap <b>Camera</b>, which will say <b>Ask</b>, and choose <b>Allow</b>.</li>
      </ol>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        On older versions of iOS the button is <b>aA</b>, on the left side of the address bar, and
        <b>Website Settings</b> is in its menu. To take the permission back, set Camera to Ask again in the
        same place.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The scanner only recognizes QR codes that pattern-match against Kipukas playing cards. For the best
        experience during a game, prevent your device from sleeping — a caffeine-mode app is recommended.
        If you prefer a standalone app, we recommend the open-source Android app
        <b>Binary Eye</b> (same code library as ours) or <b>Cognex Barcode Scanner</b> on iPhone.
      </p>

      <div class="z-20 w-5/6 md:w-4/6 place-self-center pb-4 flex flex-wrap gap-4 justify-center">
        <img src="/game_rules/images/QR_modal.jxl?d=1024" alt="The scanner's privacy notice"
          class="w-full max-w-xs h-fit rounded shadow" loading="lazy" />
        <img src="/game_rules/images/QR_scanner.jxl?d=1024" alt="The QR scanner open over a card page"
          class="w-full max-w-xs h-fit rounded shadow" loading="lazy" />
      </div>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 italic text-xs md:text-sm">
        An earlier version of the QR scanner running on a 1080p laptop. The card being scanned is
        "Shard's Desert" — the first card commissioned for Kipukas.
      </p>

      <!-- ─── Fists Tool ─── -->
      <h2 id="fists-tool" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Fists Tool</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The fists tool determines the typing match-ups for KEAL means and Archetypal Gene interactions. It is
        accessible from the side toolbar on the home page and on every card page.
      </p>

      <h3 class="z-20 text-lg md:text-xl pt-4 pb-1 place-self-center">Local (Single-Player) Mode</h3>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Click the fists icon in the toolbar to open the tool without connecting to an opponent. Check up to
        three archetypes each for the attacker and the defender, and a motivation each for Final Blows, to
        instantly see the resulting Attack Die Modifier. This is useful for checking type match-ups during
        play or studying card interactions on your own.
      </p>

      <h3 class="z-20 text-lg md:text-xl pt-4 pb-1 place-self-center">Multiplayer Mode</h3>
      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        When two players connect through a multiplayer room, the fists tool enables simultaneous, hidden
        submissions — mimicking the "write it on your grease board" experience digitally. The flow:
      </p>

      <ol class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-decimal list-inside space-y-1">
        <li>One player opens the room tool (the signal icon in the toolbar), names a room, and creates it. They share the room's name and four-character code with their opponent.</li>
        <li>The other player joins by entering the code and the name. From then on the fists icon in both toolbars opens the multiplayer tool.</li>
        <li>Each player goes to the page of the card they are playing, opens the fists tool, chooses whether they are attacking or defending, picks a KEAL means, and locks in their choice. For Final Blows the tool states the card's motivation instead. Choices are hidden until both sides have locked in.</li>
        <li>Once both players submit, the tool reveals the match-up result with all applicable modifiers (archetypal material interactions, affinity bonus, etc.) and the total Attack Die Modifier.</li>
        <li>After reviewing the result, either player can report the combat outcome ("Did you win?"). The tool then automatically marks KEAL means damage on the losing defender's card, and both players see a role-appropriate result message.</li>
        <li>Either player can start a new round for the next bout.</li>
      </ol>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The room stays with you as you move between pages, so you can scan QR codes or open other cards
        without losing it, including a card opened in a new tab. A round in progress is kept too: closing the
        fists tool only hides it, and <em>Cancel round</em> calls the round off for both players. A small dot
        in the bottom-left corner shows the connection: green when your opponent is connected, with a short
        note when either of you is reconnecting.
      </p>

      <div class="z-20 w-5/6 md:w-4/6 place-self-center pb-4 flex flex-wrap gap-4 justify-center">
        <img src="/game_rules/images/fists_open.jxl?d=1024" alt="The fists tool open, with a match-up picked"
          class="w-full max-w-xs h-fit rounded shadow" loading="lazy" />
        <img src="/game_rules/images/fists_closed.jxl?d=1024" alt="The toolbar on a card page, with the fists icon circled"
          class="w-20 h-fit rounded shadow" loading="lazy" />
      </div>

      <!-- ─── KEAL Means Damage Tracker ─── -->
      <h2 id="damage-tracker" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">KEAL Means Damage Tracker</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Each card page on kipukas.cards includes a damage tracker. Every KEAL means has a heart for each
        injury it can take. Tap a heart to break it, and tap it again to mend it. Once every heart is broken the
        <b>Final Blows</b> section appears, indicating the card is downed and vulnerable to a final attack. If
        the card is wasted, tap the <b>Wasted</b> heart.
      </p>

      <div class="z-20 w-5/6 md:w-4/6 place-self-center pb-4 flex flex-wrap gap-4 justify-center">
        <img src="/game_rules/images/healthy_keal_means.jxl?d=1024" alt="A KEAL means with its heart whole"
          class="w-full max-w-64 h-fit rounded shadow" loading="lazy" />
        <img src="/game_rules/images/injured_keal_means.jxl?d=1024" alt="The same KEAL means with its heart broken, and Final Blows below"
          class="w-full max-w-64 h-fit rounded shadow" loading="lazy" />
      </div>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        After your game is complete, use <b>New Game</b> (the sparkles icon in a card page's toolbar) to mend
        every card, clear your affinity, and remove your turn timers. In a multiplayer room the shared timers
        stay.
      </p>

      <div class="z-20 w-5/6 md:w-4/6 place-self-center pb-4 flex justify-center">
        <img src="/game_rules/images/keal_means_clean.jxl?d=1024" alt="The New Game button in the toolbar"
          class="w-16 h-fit rounded shadow" loading="lazy" />
      </div>

      <!-- ─── Turn Timer ─── -->
      <h2 id="turn-timer" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Turn Timer</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The turn timer tool helps players keep track of anything that lasts a number of diel cycles. Open it
        from the clock icon in the toolbar, give the timer a name, a number of diel cycles, and a color, and it
        joins the list at the top left of the page. Each time the diel die is rolled, press
        <b>Advance on Diel Roll</b> and every timer counts down by one. In a multiplayer room the timers are
        shared, so both players see the same list and neither side can run the clock without the other knowing.
      </p>

      <!-- ─── Affinity Tool ─── -->
      <h2 id="affinity-tool" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Affinity Tool</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Open the affinity tool by clicking the <b>Heart icon</b> in the toolbar. Here you declare your
        affinity for one archetypal adaptation for the game. The choice is then locked until you start a
        <b>New Game</b>. When a soul card's archetypal adaptation matches your declared affinity
        you receive a <b>+1 bonus to attack and defense rolls</b> made for that card. The fists tool
        automatically includes this bonus in the Attack Die Modifier when applicable.
      </p>

      <!-- ─── Loyalty Tracking ─── -->
      <h2 id="loyalty-tracking" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Loyalty Tracking</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Each time you play a specific Character or Species card in fists combat on kipukas.cards, that card's
        loyalty counter increases (once per day per card). Loyalty is displayed as a <b>"♥ N plays"</b> badge on
        the card's page. Loyalty also increases if you came to own the card through an incubation card (not yet
        tracked digitally). Both affinity and loyalty are limited to once per day, except at tournaments which
        will be once per match.
      </p>

      <!-- ─── Tameability Progress ─── -->
      <h2 id="tameability-progress" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Tameability Progress</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Basic tameability tracking is now live on kipukas.cards. Each Species card page shows a
        <b>progress bar</b> comparing your current affinity level and loyalty plays against the card's
        tameability threshold. When the threshold is met a <b>"✔ Tamed!"</b> indicator appears. The full taming
        mechanic (incubation bonuses, rogue control triggers, in-game card effect stacking) remains future work.
      </p>

      <!-- ─── Recipes Lookup ─── -->
      <h2 id="recipes-lookup" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Recipes Lookup</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        During our founders period all recipe combinations possible with the founder's deck items have been
        published. You can find the recipe lookup tool under <b>"View Item Recipes"</b> in the toolbar's menu. In the future these
        will also be produced as physical recipe cards. The founder's recipes will always be accepted at
        competitions as open use and the online lookup will always reside on the binder.
      </p>

      <div class="z-20 w-5/6 md:w-4/6 place-self-center pb-4 flex justify-center">
        <img src="/game_rules/images/recipe_lookup.jxl?d=1024" alt="The recipe lookup with three items checked, showing the Basic bow recipe"
          class="w-full max-w-xs h-fit rounded shadow" loading="lazy" />
      </div>

      <!-- ─── Kippa Chatbot ─── -->
      <h2 id="kippa" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Kippa (Rules Chatbot)</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Kippa is an <b>alpha</b> feature designed to assist players in learning the rules. It lives in the
        <a href="/game_rules/" class="underline">Rules</a>, behind the round button in the bottom right corner, and
        can answer questions about game mechanics, card interactions, and general Kipukas information.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Limitations to be aware of:</b>
      </p>

      <ul class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-disc list-inside space-y-1">
        <li><b>Short conversation memory</b> — only your last three exchanges are sent along with a new question; anything older is not remembered.</li>
        <li><b>Online only</b> — Kippa runs on our server, so it is not available offline.</li>
        <li><b>Conversation history limited</b> — once the page refreshes the history is wiped.</li>
        <li><b>Expect delays</b> — limited hardware capacity means requests may queue when busy (30 s timeout).</li>
        <li><b>Check facts</b> — Kippa can hallucinate and produce inaccurate results. The rules text is the canonical source.</li>
        <li><b>Offensive information</b> — while unlikely, Kippa may produce offensive or biased content. This does not reflect the views of Kipukas as a company.</li>
        <li><b>Context limits</b> — text input amount is limited, as is Kippa's output length.</li>
        <li><b>Interactions may be logged</b> — prompts and responses may be saved for debugging and improvement. By using the chat you agree to have your chat stored. No other personal data is collected and no identifying data is ever collected.</li>
        <li><b>Topic limits</b> — Kippa is trained to only respond to questions relevant to the rules, itself, and Kipukas.</li>
      </ul>

      <!-- ─── Player Data & Sync ─── -->
      <h2 id="player-data" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Player Data &amp; Device Sync</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        Your game progress (card damage, turn timers, affinity and loyalty) lives on <b>your device only</b>.
        <a href="/player_data" class="underline">Player Data</a>, in the hamburger menu, is where you carry it
        to another device or keep a copy of it.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Sync a device</b> carries a game on from one device to another:
      </p>

      <ol class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-decimal list-inside space-y-1">
        <li>On the device that has the game, open Player Data, press <b>Sync a new device</b> and confirm. It shows a QR code, and the same code in letters.</li>
        <li>On the other device, scan the QR code: with the site's QR scanner, or with the camera app, which opens the site. You can also open Player Data there and type the code.</li>
        <li>The other device asks whether to take the game, and tells you what it would lose. Press <b>Take the game</b>.</li>
      </ol>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The game in progress on the other device is <b>replaced</b> by the one you sent: its damage, timers and
        affinity. Your record is <b>merged</b>: each card's loyalty is added together on both devices, and a day
        both devices counted is counted once. If you are in a room with another player, your place in the room
        goes with the game: the other device carries on there, and the device you sent it from leaves the room.
        A code works once, and for ten minutes. The two devices talk through our relay, which cannot read what
        they say: it is encrypted with a key that only the code carries.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <b>Backup</b> exports your player data as an encrypted <code>.kipukas</code> file, locked with a passphrase
        you choose, and imports one. Importing treats the file as a sync treats the other device: the backup's
        game replaces the one on the device, and your record is merged. A backup also carries the switches on
        the Settings page. Keep the passphrase safe: it cannot be recovered.
      </p>

      <!-- ─── Settings ─── -->
      <h2 id="settings" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Settings</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        <a href="/settings" class="underline">Settings</a>, in the hamburger menu, holds switches that are kept
        on the device you set them on:
      </p>

      <ul class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-disc list-inside space-y-1">
        <li><b>Camera privacy notice</b> — on once you have accepted the QR scanner's privacy notice. Turn it off to take that back; the scanner will show its notice again before it next uses the camera.</li>
        <li><b>Scanner status</b> — shows a small readout on the scanner of the camera's picture size and how long each frame takes to read. Off unless you turn it on.</li>
      </ul>

      <!-- ─── General Tips ─── -->
      <h2 id="tips" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">General Tips</h2>

      <ul class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-disc list-inside space-y-1">
        <li>Use a <b>caffeine-mode app</b> to prevent your device from sleeping during play.</li>
        <li>A <b>front-facing (selfie) camera</b> works best with the QR scanner and phone stand.</li>
        <li>The binder works <b>offline</b> after the first load — great for venues with spotty Wi-Fi.</li>
        <li>A <b>Chromium-based browser</b> (Chrome, Edge, Brave, etc.) provides the best experience.</li>
      </ul>

      <!-- ─── Installing ─── -->
      <h2 id="installing" class="z-20 text-xl md:text-2xl pt-6 pb-2 place-self-center">Installing the Binder</h2>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The binder is a web app that can be installed, which gives it an icon of its own and its own window,
        and has it fetch the card art ahead of time for playing offline. Installing collects no data from you.
      </p>

      <ul class="z-20 w-5/6 md:w-4/6 place-self-center pb-2 list-disc list-inside space-y-1">
        <li><b>Android and computers</b> — press the <b>install</b> button in the toolbar (an arrow pointing down into a tray) and choose <b>Install</b>. If your browser cannot install web apps, the button tells you so. Chromium-based browsers install most reliably.</li>
        <li><b>iPhone and iPad</b> — Safari has no install button for us to press. Use Safari's <b>Share</b> button, then <b>Add to Home Screen</b>. There the installed binder keeps its own player data, apart from Safari's: use <a href="#player-data" class="underline">Sync a device</a> or a backup to carry a game between the two.</li>
      </ul>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-2">
        The install button goes away once the binder is installed, and its notice has a box to hide it if you
        would rather not be asked.
      </p>

      <p class="z-20 w-5/6 md:w-4/6 place-self-center pb-6">
        For more about the binder's philosophy, privacy stance, and business model see
        <a href="/about_the_binder" class="underline">About the Binder</a>. For our open-source technology
        stack and licenses see <a href="/open_stack" class="underline">Open Stack &amp; Licenses</a>.
      </p>
