      <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the default behavior (which would be to show the install prompt automatically)
    e.preventDefault();
    // Stash the event so it can be triggered later.
    deferredPrompt = e;
    });

    // ============================================
    // AUTO-HIDE: detect if the PWA is already installed
    // ============================================

    // Layer 1: If running in standalone / fullscreen mode, the PWA is installed.
    if (window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        navigator.standalone === true) {
      // We need to wait for Alpine to initialise the data stack before setting.
      document.addEventListener('alpine:init', () => {
        Alpine.store('__pwaInstalled', true);
      });
      // Also set via DOM once body x-data is ready (belt-and-suspenders)
      document.addEventListener('DOMContentLoaded', () => {
        const body = document.body;
        if (body && body._x_dataStack) {
          body._x_dataStack[0].hideInstallButton = true;
        }
      });
      // Installed PWA launch: warm/resume the offline cache (idempotent — skips
      // already-cached entries, so re-running each launch finishes an interrupted warm).
      if (navigator.serviceWorker) {
        navigator.serviceWorker.ready.then((reg) => {
          if (reg.active) reg.active.postMessage({ type: 'WARM_OFFLINE_CACHE' });
        });
      }
    }

    // Layer 2: Listen for the appinstalled event (fires when user completes install).
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App installed — hiding install button');
      // Set Alpine persisted state so the button stays hidden on future visits
      const body = document.body;
      if (body && body._x_dataStack) {
        body._x_dataStack[0].hideInstallButton = true;
      }
      deferredPrompt = null;

      // Notify the Service Worker so it can track install state independently,
      // and ask it to warm the full offline cache (card art + QR decoder).
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'PWA_INSTALLED' });
        navigator.serviceWorker.controller.postMessage({ type: 'WARM_OFFLINE_CACHE' });
      }
    });

    // Layer 3: Ask the Service Worker if it already knows the PWA was installed.
    // This covers cases where localStorage was cleared but the SW persists.
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then((registration) => {
        if (!registration.active) return;
        const ch = new MessageChannel();
        ch.port1.onmessage = (msg) => {
          if (msg.data && msg.data.installed === true) {
            const body = document.body;
            if (body && body._x_dataStack) {
              body._x_dataStack[0].hideInstallButton = true;
            }
          }
        };
        registration.active.postMessage({ type: 'PWA_INSTALL_CHECK' }, [ch.port2]);
      });
    }

    // Check if the deferred prompt isn't null, then show the prompt
    function handlePWAInstall() {
    if (deferredPrompt) {
        deferredPrompt.prompt();

        // Wait for the user to make a choice
        deferredPrompt.userChoice.then((choiceResult) => {
            console.log('[PWA] Install choice:', choiceResult.outcome);
            if (choiceResult.outcome === 'accepted') {
                // The appinstalled event will fire and handle hiding,
                // but set it here too for immediate feedback.
                const body = document.body;
                if (body && body._x_dataStack) {
                    body._x_dataStack[0].hideInstallButton = true;
                }
            }
            // We've used the prompt, and can't use it again, so set this to null
            deferredPrompt = null;
        });
    } else {
        alert(`You are unable to install the Kipukas Binder web app at this time.
        
If you already installed our app, then great! This is expected because you don't need to install it again. Click ok to hide the install button.
        
If you have not already installed our pwa, check if your browser (and launcher if on android) support(s) pwa installs. While many browsers work well, Chromium based browsers (i.e. Bromite, Vanadium, Brave, and of course Google Chrome) deliver the most consistent experience across devices followed closely by firefox. We will go ahead and hide the install button.`);

        // Hide the install button
        const body = document.body;
        if (body && body._x_dataStack) {
            body._x_dataStack[0].hideInstallButton = true;
        }
    }
}
    
</script>

      <!-- Local Fists Tool — archetype/motivation matchup calculator.
     The boxes and the result are three engine-owned views (Pattern 13,
     assets/js/kipukas-view.js) of /api/type-matchup: the engine holds what is
     picked, renders the boxes checked or disabled accordingly, and works out
     the result (kipukas-server/src/game/matchup.rs). A box is a post to the
     engine; this file holds no count, no copy of the choices and no script.
     Alpine opens and closes the dialog and folds its two sections: purely
     visual. A view is drawn when it is shown. -->
<div x-data="{ showTypeMenu: false, showKeal: true, showMot: true }"

        </div>
    </div>
</div>

    

    

    
      <!-- The room dialog (wifi icon): where a room is created, joined and left.
     What it holds is an engine-owned view (Pattern 13, assets/js/kipukas-view.js)
     of /api/room/status: the engine draws where the player stands, the forms
     and buttons in it post back to the engine, and it is drawn again when the
     relay or the opponent changes what it shows
     (kipukas-server/src/routes/room_status.rs, src/game/connection.rs).
     This file only opens and closes it. The engine is told of the closing, so
     that what it had to say (a room code that was wrong) is not said again. -->
<div x-data="{ showMultiplayer: false }" class="relative place-content-center"
     x-init="$watch('showMultiplayer', value => { if (!value) kipukasViews.post('/api/room/status', 'action=close'); })"
     @close-multiplayer.window="showMultiplayer = false">
  <!-- Multiplayer toggle button (wifi icon) -->
  <button aria-label="Toggle Multiplayer" @click="showMultiplayer = !showMultiplayer" class="toolbar-tile">
    <svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="toolbar-tile-icon fill-kip-drk-goldenrod hover:fill-kip-red">
      <path fill-rule="evenodd" d="M1.371 8.143c5.858-5.857 15.356-5.857 21.213 0a.75.75 0 0 1 0 1.061.75.75 0 0 1-1.06 0c-5.273-5.272-13.821-5.272-19.092 0a.75.75 0 0 1-1.06-1.06Zm3.182 3.182c4.1-4.1 10.749-4.1 14.85 0a.75.75 0 1 1-1.061 1.06 8.25 8.25 0 0 0-12.728 0 .75.75 0 0 1-1.06-1.06Zm3.182 3.182a6 6 0 0 1 8.486 0 .75.75 0 1 1-1.06 1.06 4.5 4.5 0 0 0-6.364 0 .75.75 0 0 1-1.06-1.06ZM12 18a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 0 1.5H12.75A.75.75 0 0 1 12 18Z" clip-rule="evenodd" />
    </svg>
  </button>

  <!-- Full-screen modal overlay -->
  <div x-show="showMultiplayer" x-cloak
    role="dialog" aria-modal="true" aria-label="Multiplayer room"
    x-trap="showMultiplayer" @keydown.escape.window="showMultiplayer = false"
    class="fixed inset-0 flex items-center justify-center z-50"
    x-transition.duration.350ms>

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-300 opacity-75" @click="showMultiplayer = false"></div>

    <!-- Modal content -->
    <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto relative">
      <div id="room-status" data-engine-view="/api/room/status"></div>

      <!-- Close button -->
      <div class="border-t border-slate-300 p-3">
        <button @click="showMultiplayer = false"
          class="w-full bg-slate-400 hover:bg-slate-500 text-amber-50 font-bold py-2 px-4 rounded text-sm">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
    

    
      <!-- The binder's filter menu. Its boxes are engine-owned views (Pattern 13,
     assets/js/kipukas-view.js) of /api/cards, the route the grid is a view of:
     the engine holds which boxes are ticked, renders them ticked or disabled
     accordingly, and says how many cards there are
     (kipukas-server/src/routes/cards.rs). A box is a post to the engine, after
     which the menu and the grid are drawn again. Alpine opens the menu and
     folds its groups: purely visual. A group is drawn when it is unfolded. -->
<div x-data="{ showFilter: false, showVariation: false, showSoulType: false, showMotivation: false, showHabitat: false }" class="relative place-content-center">
    <div x-show="showFilter" id="filter-popover" role="region" aria-label="Card filters"
        x-anchor.right-end.offset.10="$refs.filter"
        x-transition.duration.350ms
        class="text-kip-drk-goldenrod bg-amber-50 mt-2 h-fit w-36 py-3 pl-4 rounded-md shadow-lg ring-1 ring-black/5 focus:outline-hidden transition-opacity duration-300">
        <div data-engine-view="/api/cards?menu=all"></div>
        <button type="button" class="flex w-full items-center text-left" @click="showVariation = !showVariation" :aria-expanded="showVariation" aria-controls="filter-variations">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                :class="{ 'rotate-90': showVariation }"
                class="fill-none stroke-2 stroke-kip-drk-goldenrod w-6 h-6 transition-transform">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
            <span>Variations</span>
        </button>
        <div x-show="showVariation" id="filter-variations" data-engine-view="/api/cards?menu=variations"></div>
        <button type="button" class="flex w-full items-center text-left" @click="showSoulType = !showSoulType" :aria-expanded="showSoulType" aria-controls="filter-soultypes">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                :class="{ 'rotate-90': showSoulType }"
                class="fill-none stroke-2 stroke-kip-drk-goldenrod w-6 h-6 transition-transform">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
            <span>Soul Types</span>
        </button>
        <div x-show="showSoulType" id="filter-soultypes" data-engine-view="/api/cards?menu=soultypes"></div>
        <button type="button" class="flex w-full items-center text-left" @click="showMotivation = !showMotivation" :aria-expanded="showMotivation" aria-controls="filter-motivations">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                :class="{ 'rotate-90': showMotivation }"
                class="fill-none stroke-2 stroke-kip-drk-goldenrod w-6 h-6 transition-transform">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
            <span>Motivations</span>
        </button>
        <div x-show="showMotivation" id="filter-motivations" data-engine-view="/api/cards?menu=motivations"></div>
        <button type="button" class="flex w-full items-center text-left" @click="showHabitat = !showHabitat" :aria-expanded="showHabitat" aria-controls="filter-habitats">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                :class="{ 'rotate-90': showHabitat }"
                class="fill-none stroke-2 stroke-kip-drk-goldenrod w-6 h-6 transition-transform">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
            <span>Habitats</span>
        </button>
        <div x-show="showHabitat" id="filter-habitats" data-engine-view="/api/cards?menu=habitats"></div>
    </div>
    <button aria-label="show filter options" :aria-expanded="showFilter" aria-controls="filter-popover" @click="showFilter = !showFilter" x-ref="filter" class="toolbar-tile">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 24 24"
        class="toolbar-tile-icon fill-none stroke-kip-drk-goldenrod hover:stroke-kip-red active:stroke-kip-drk-sienna">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" />
        </svg>
    </button>
</div>
    

    

    

    
      <a :href="previousURL" aria-label="Go to last visited page" class="toolbar-tile hidden lg:inline-flex">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          class="toolbar-tile-icon fill-none stroke-kip-drk-goldenrod hover:stroke-kip-red active:stroke-kip-drk-sienna">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>
      </a>
    
    
  </div>
  
  <button type="button" aria-label="Toggle tools" :aria-expanded="showTools"
    @click="showTools = !showTools" @keydown.enter.space.prevent="showTools = !showTools"
    class="toolbar-tile-pill mb-2 place-self-center">
    <svg xmlns="http://www.w3.org/2000/svg" :class="{ 'rotate-180': !showTools }"
      class="fill-none stroke-2 stroke-kip-drk-goldenrod w-6 h-6 transition-transform">
      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
    </svg>
  </button>
  

</div>


<!-- The card grid: an engine-owned view (Pattern 13, assets/js/kipukas-view.js).
     The engine holds which cards the binder shows and how many are on the page
     so far, and renders the tiles (kipukas-server/src/routes/cards.rs). After
     them it puts a marker; when that scrolls into view the page asks for the
     next batch and the engine adds it. {columns} tells the engine how many
     columns the grid has just now, so that a batch is whole rows.
     Mobile: 160px min tiles. Desktop (lg+): 200px min. -->
<div id="card-grid"
  class="grid gap-5 justify-items-center px-4 grid-cols-[repeat(auto-fill,minmax(160px,1fr))] lg:grid-cols-[repeat(auto-fill,minmax(200px,1fr))]"
  data-engine-view="/api/cards?columns={columns}"></div>
</main>
  </body>
</html>
