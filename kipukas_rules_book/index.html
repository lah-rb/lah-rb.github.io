<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kipukas — Game Rules</title>

    <!-- Unified Tailwind CSS (built by main site) -->
    <!-- Dev: relative path to main site output; Build: replaced with local copy -->
    <link rel="stylesheet" href="../assets/css/output.css">
    <link rel="stylesheet" href="css/print.css">

    <!-- Favicons (shared with main site) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/ico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/ico/favicon-16x16.png">
    <meta name="theme-color" content="#0369a1">

    <!-- Alpine.js (shared site bundle) -->
    <script defer src="/assets/js/alpine.bundle.min.js"></script>

    <!-- HTMX (needed for QR scanner WASM routes) -->
    <script defer src="/assets/js/htmx.min.js"></script>

    <!-- WASM API bridge: enables QR scanner + multiplayer reconnect -->
    <script defer src="/assets/js/kipukas-api.js"></script>

    <!-- Register the Service Worker so /game_rules/ controls .jxl decode + caching
         even when deep-linked directly (reloads once on first controllerchange). -->
    <script src="/assets/js/pwa-update-handler.js" defer></script>

    <!-- Lazy loaders for site-wide tools -->
    <script>
      window.kipukasLoadQR = function() {
        if (window.kipukasQRLoaded) return Promise.resolve();
        return import('/assets/js/qr-camera.js')
          .then(function() { window.kipukasQRLoaded = true; })
          .catch(function(err) { console.error('Failed to load QR camera:', err); });
      };
    </script>
</head>
<body class="rules-book-layout bg-emerald-200 text-slate-900 h-screen flex flex-col font-sans"
      x-data="rulesBook()"
      x-init="init()"
      @hashchange.window="handleHash()"
      @keydown.meta.k.window.prevent="showSearchBar = true; $nextTick(() => { $refs.searchInput.focus(); $refs.searchInput.select(); })"
      @keydown.ctrl.k.window.prevent="showSearchBar = true; $nextTick(() => { $refs.searchInput.focus(); $refs.searchInput.select(); })">

    <!-- Floating toolbar (mirrors the binder's mobile toolbar). Below lg the tiles
         fade to translucent ghosts after inactivity; a tap re-colors them (the
         capture handler swallows that first wake-tap so it doesn't fire an action). -->
    <div class="ghost-toolbar z-40 flex flex-col items-center gap-2 fixed top-0 right-0 w-fit mx-2 my-6 md:m-8"
         :class="{ 'toolbar-idle': toolbarIdle }"
         @click.capture="if (toolbarIdle && $event.target.closest('.toolbar-tile')) { $event.stopPropagation(); $event.preventDefault(); } pokeToolbar()"
         @keydown.capture="pokeToolbar()">

        <!-- Site nav menu (top, per binder convention) -->
        <div class="relative w-fit" @click.outside="showHamburger = false">
            <button @click="showHamburger = !showHamburger" x-ref="hamburger"
                    class="toolbar-tile text-kip-drk-goldenrod hover:text-kip-red relative"
                    title="Site menu" aria-label="Site menu">
                <span class="sr-only">Site menu</span>
                <div class="block w-5 absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
                    <span class="block absolute h-0.5 w-6 bg-current transform transition duration-500" :class="{'rotate-45': showHamburger,'-translate-y-1.5': !showHamburger }"></span>
                    <span class="block absolute h-0.5 w-6 bg-current transform transition duration-500" :class="{'opacity-0': showHamburger }"></span>
                    <span class="block absolute h-0.5 w-6 bg-current transform transition duration-500" :class="{'-rotate-45': showHamburger,'translate-y-1.5': !showHamburger}"></span>
                </div>
            </button>
            <div x-anchor.right-end.offset.10="$refs.hamburger" x-show="showHamburger" x-cloak x-transition.duration.350ms
                 class="text-nowrap bg-amber-50 h-fit w-fit py-3 px-1 rounded-md shadow-lg ring-1 ring-black/5 z-50">
                <div><a href="/" class="block p-2 text-left text-lg text-kip-drk-goldenrod rounded-lg hover:bg-amber-100 active:bg-amber-100 w-full">Binder Home</a></div>
                <div><a href="/game_rules/index.html" class="block p-2 text-left text-lg text-kip-drk-goldenrod rounded-lg hover:bg-amber-100 active:bg-amber-100 w-full">See the Rules</a></div>
                <div><a href="/recipes" class="block p-2 text-left text-lg text-kip-drk-goldenrod rounded-lg hover:bg-amber-100 active:bg-amber-100 w-full">View Item Recipes</a></div>
                <div><a href="/privacy_policy" class="block p-2 text-left text-lg text-kip-drk-goldenrod rounded-lg hover:bg-amber-100 active:bg-amber-100 w-full">Privacy Policy</a></div>
                <div><a href="/about_articles" class="block p-2 text-left text-lg text-kip-drk-goldenrod rounded-lg hover:bg-amber-100 active:bg-amber-100 w-full">About Kipukas</a></div>
            </div>
        </div>

        <!-- Search tile + revealed input (showSearchBar lives in the root rulesBook() scope
             so the body-level Cmd/Ctrl-K handler can reach $refs.searchInput) -->
        <div class="relative w-fit"
             @click.outside="showSearchBar = false; showSearchResults = false">
            <button x-ref="searchBtn" class="toolbar-tile" :class="{ 'toolbar-tile-active': showSearchBar }"
                    title="Search rules" aria-label="Search rules"
                    @click="showSearchBar = !showSearchBar; if (showSearchBar) { $nextTick(() => $refs.searchInput.focus()) } else { clearSearch() }">
                <svg class="toolbar-tile-icon fill-none stroke-kip-drk-goldenrod hover:stroke-kip-red" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </button>
            <div x-anchor.right-end.offset.10="$refs.searchBtn" x-show="showSearchBar" x-cloak x-transition.duration.350ms
                 class="w-72 sm:w-96">
                <div class="flex items-center bg-amber-50 rounded-xl border-2 border-kip-drk-sienna focus-within:border-kip-goldenrod transition-colors">
                    <svg class="w-4 h-4 ml-3 text-kip-drk-goldenrod" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input x-ref="searchInput" type="text" placeholder="Search rules..." autocomplete="off"
                        x-model="searchQuery"
                        @input="onSearchInput()"
                        @keydown.escape="clearSearch(); showSearchBar = false; $refs.searchInput.blur()"
                        class="bg-transparent text-kip-drk-sienna placeholder-slate-400 px-3 py-2 text-sm w-full focus:outline-none">
                    <button x-show="searchQuery" x-cloak @click="clearSearch()" class="pr-3 text-kip-drk-goldenrod hover:text-kip-red">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <!-- Search results dropdown -->
                <div x-show="showSearchResults" x-cloak x-transition
                     class="mt-2 bg-amber-50 rounded-xl shadow-2xl border-2 border-kip-drk-sienna max-h-96 overflow-y-auto">
                    <template x-if="searchResults.length === 0 && searchQuery.length >= 2">
                        <div class="p-4 text-center text-slate-500 text-sm">No results found</div>
                    </template>
                    <template x-for="r in searchResults" :key="r.id">
                        <button @click="selectSearchResult(r.id); showSearchBar = false"
                                class="block w-full text-left px-4 py-3 hover:bg-emerald-50 border-b border-emerald-100 last:border-0 transition-colors">
                            <div class="font-semibold text-kip-drk-sienna text-sm" x-text="r.title"></div>
                            <div class="text-xs text-slate-600 mt-1 leading-relaxed" x-html="r.snippet"></div>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <!-- QR scanner tile (binder's QR icon) -->
        <button class="toolbar-tile" title="Scan QR Code" aria-label="Scan QR code"
                onclick="window.kipukasLoadQR().then(function() { if (window.kipukasQR) window.kipukasQR.toggle(); })">
            <svg class="toolbar-tile-icon fill-kip-drk-goldenrod hover:fill-kip-red" viewBox="0 0 128 128">
                <path d="M306.692 182.753a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-16a2 2 0 0 0-2-2zm4 4h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM276.692 152.753a2.003 2.003 0 0 0-2 2v24a2.003 2.003 0 0 0 2 2h24a2.003 2.003 0 0 0 2-2v-24a2.003 2.003 0 0 0-2-2zm4 4h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-16a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2zm4 4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zM306.692 152.753a2.003 2.003 0 0 0-2 2v24a2.003 2.003 0 0 0 2 2h24a2.003 2.003 0 0 0 2-2v-24a2.003 2.003 0 0 0-2-2zm4 4h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-16a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2zm4 4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zM276.692 182.753a2.003 2.003 0 0 0-2 2v24a2.003 2.003 0 0 0 2 2h24a2.003 2.003 0 0 0 2-2v-24a2.003 2.003 0 0 0-2-2zm4 4h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-16a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2zm4 4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2z" transform="matrix(2.2069 0 0 2.2069 -606.216 -337.109)"/>
            </svg>
        </button>

        <!-- Print/PDF tile — a REAL <a> (a synthetic anchor .click() with download
             routes to about:blank on Firefox for Android). `download` saves the PDF
             where supported; target=_blank gracefully opens it in a new tab otherwise.
             Falls back to window.print() only when the pre-built PDF isn't present. -->
        <a href="kipukas_rules.pdf" download="kipukas_rules.pdf" target="_blank" rel="noopener"
           @click="openPdf($event)"
           class="toolbar-tile" title="Export to PDF" aria-label="Export to PDF">
            <svg class="toolbar-tile-icon fill-none stroke-kip-drk-goldenrod hover:stroke-kip-red" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
            </svg>
        </a>

        <!-- Contents → TOC modal (bottom) -->
        <button @click="toggleToc()" x-ref="tocBtn" class="toolbar-tile" :class="{ 'toolbar-tile-active': tocOpen }"
                title="Table of contents" aria-label="Table of contents">
            <svg class="toolbar-tile-icon fill-none stroke-kip-drk-goldenrod hover:stroke-kip-red" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
            </svg>
        </button>
    </div>

    <!-- Table of Contents modal -->
    <div x-show="tocOpen" x-cloak role="dialog" aria-modal="true" aria-labelledby="toc-title"
         x-trap="tocOpen" class="fixed inset-0 flex items-center justify-center z-50"
         x-transition.duration.350ms @keydown.escape.window="closeToc()">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-300 opacity-75" @click="closeToc()"></div>
        <!-- Card -->
        <div class="bg-amber-50 z-50 rounded-lg shadow-xl w-full max-w-lg max-h-[85vh] overflow-y-auto relative mx-4">
            <div class="sticky top-0 bg-amber-50 px-5 pt-4 pb-3 border-b border-kip-drk-goldenrod/30 flex items-center justify-between">
                <h2 id="toc-title" class="text-lg font-bold text-kip-drk-sienna">Table of Contents</h2>
                <button @click="closeToc()" class="text-kip-drk-goldenrod hover:text-kip-red" aria-label="Close contents">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <nav class="px-4 py-3 space-y-0.5">
                <template x-for="h in headers" :key="h.id">
                    <a :href="'#' + h.id"
                       @click.prevent="tocClick(h.id)"
                       class="toc-link"
                       :class="{
                           'active': activeId === h.id,
                           'toc-sub': h.level === 3
                       }"
                       x-text="h.text"
                       x-effect="if (tocOpen && activeId === h.id) $el.scrollIntoView({ block: 'nearest' })"></a>
                </template>
            </nav>
        </div>
    </div>

    <!-- Content (full-width scroller; only element that scrolls) -->
    <main id="content-scroll" class="flex-1 overflow-y-auto bg-emerald-50">
        <div id="rules-content"
             class="prose prose-sky lg:prose-lg max-w-4xl mx-auto px-4 sm:px-8 pt-8 pb-8 bg-white shadow-sm min-h-full"
             @click="handleContentClick($event)">
            <!-- Loading state (replaced by build-time pre-render) -->
            <div id="loading" class="flex items-center justify-center h-64 not-prose">
                <div class="text-center">
                    <svg class="animate-spin h-8 w-8 text-emerald-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-emerald-700">Loading rules...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- QR Overlay -->
    <div id="qr-container"></div>

    <!-- Chat Widget (Kippa) -->
    <div class="fixed bottom-5 right-5 z-50">
        <!-- Chat toggle button -->
        <button @click="toggleChat()" class="w-14 h-14 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow-xl flex items-center justify-center transition-all hover:scale-105">
            <svg x-show="!chatOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <svg x-show="chatOpen" x-cloak class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
        </button>

        <!-- Chat panel -->
        <div x-show="chatOpen" x-cloak
             x-transition.duration.300ms
             class="absolute bottom-16 right-0 w-80 sm:w-96 h-112 bg-emerald-950 rounded-2xl shadow-2xl border border-emerald-800 flex flex-col overflow-hidden"
             id="chat-panel">
            <!-- Chat header -->
            <div class="bg-emerald-900 px-4 py-3 flex items-center gap-2 border-b border-emerald-800 shrink-0">
                <div class="w-7 h-7 bg-emerald-600 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                    </svg>
                </div>
                <span class="font-semibold text-emerald-100 text-sm">Kippa — Rules Assistant</span>
                <div class="flex-1"></div>
                <div class="w-2 h-2 rounded-full"
                     :class="chatConnected ? 'bg-green-500' : 'bg-gray-500'"
                     :title="chatConnected ? 'Connected' : 'Disconnected'"></div>
            </div>

            <!-- Chat messages -->
            <div x-ref="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-3 text-sm">
                <template x-for="(msg, i) in messages" :key="i">
                    <div :class="msg.isUser ? 'flex justify-end' : 'flex justify-start'">
                        <div class="chat-bubble rounded-xl px-3 py-2"
                             :class="{
                                 'bg-emerald-600 text-white rounded-br-sm': msg.isUser,
                                 'bg-emerald-800 text-emerald-100 rounded-bl-sm': !msg.isUser,
                                 'streaming-cursor': msg.streaming
                             }">
                            <div class="markdown-content"
                                 x-html="msg.isUser ? msg.text : renderChatMarkdown(msg.text)"></div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Chat input -->
            <form @submit.prevent="sendMessage()" class="border-t border-emerald-800 p-3 flex gap-2 shrink-0">
                <input type="text" x-model="chatInput" placeholder="Ask Kippa..."
                    :placeholder="chatConnected ? 'Ask Kippa...' : 'Connecting...'"
                    :disabled="!chatConnected"
                    class="flex-1 bg-emerald-900 border border-emerald-700 rounded-lg px-3 py-2 text-emerald-100 placeholder-emerald-500 text-sm focus:outline-none focus:border-emerald-500 disabled:opacity-50"
                    autocomplete="off">
                <button type="submit"
                    :disabled="!chatConnected || chatStreaming"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    x-text="chatStreaming ? '...' : 'Send'">Send</button>
            </form>
        </div>
    </div>

    <!-- Vendor dependencies (for chat markdown rendering in dev/runtime) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>

    <!-- Rules book Alpine component -->
    <script src="js/rules-book.js"></script>
</body>
</html>
