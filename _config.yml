# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Kipukas
email: kipukas.games@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Welcome to the Kipukas Card Binder! Here you will find all of the cards
  that make up Kipukas as well as some important info regarding game play.
  This site will remain free (as in beer) to use always as it is intended
  to enhance the game experience, not lock you into a pay to play system.
  Our online shop is in active development at kipukas.us where you can find
  more info and make purchases. If desired, you can always email us with
  issues or order requests. Enjoy the site!
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.kipukas.cards" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
#github_username:  jekyll
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  about:

include:
  - _about

exclude:
  # Card files, one per card. Jekyll does not build card pages: it renders one
  # card shell (card-shell.html) and the engine writes a page for each card
  # from it after every build (_plugins/card_pages.rb,
  # kipukas-server/src/site.rs). The card files are read by the engine alone,
  # when it is compiled (kipukas-server/build.rs).
  - cards/
  - kipukas-server/
  - signaling-server/
  # The QR reader's source and build (zxing-reader/build.sh). What it builds
  # is published from assets/js-wasm/.
  - zxing-reader/
  - node_modules/
  - deno.json
  - deno.lock
  - Gemfile
  - Gemfile.lock
  - WORKFLOW.md
  - kipukas_rules_book/
  - scripts/
  # Checks that drive a browser or a phone against the site (tests/devices/).
  - tests/
  # Experiment + build/source artifacts that must never leak into the served _site
  # (Jekyll ignores .gitignore, so these need to be listed explicitly).
  - YOLO_rqrr/
  - runs/
  # Kippa's server (a copy of LLMvp), kept out of git and out of the site.
  - llmvp/
  - .archive/
  - .cache/
  - CONTRIBUTING.md
  - PWA_SETUP.md
  - workbox-config.cjs
  - sw-src.js
  # sw.js is generated straight into _site by build:sw (swDest); don't let Jekyll
  # copy a stale root sw.js over it.
  - sw.js

